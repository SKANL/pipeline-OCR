[project]
name = "pipeline-ocr"
version = "0.1.0"
description = "Biblioteca Virtual Eclesiastica: ingesta, busqueda full-text y citacion de un corpus de libros eclesiasticos."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pymongo>=4.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "mistralai>=1.0",
    "pdf-inspector>=1.25.2",
    "python-multipart>=0.0.32",
    "pillow>=12.3.0",
    "opendataloader-pdf>=2.0",
    "pypdfium2>=4.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "reportlab>=5.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
