services:
  - type: web
    name: biblioteca-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - {key: MONGODB_URI, sync: false}
      - {key: MONGODB_DB, value: biblioteca}
      - {key: MISTRAL_API_KEY, sync: false}
      - {key: MISTRAL_OCR_MODEL, value: mistral-ocr-latest}
      - {key: API_KEY, sync: false}
      - {key: CORS_ORIGINS, sync: false}
      # Consumed in task A1
      - {key: S3_ENDPOINT_URL, sync: false}
      - {key: S3_ACCESS_KEY_ID, sync: false}
      - {key: S3_SECRET_ACCESS_KEY, sync: false}
      - {key: S3_BUCKET, sync: false}
      - {key: S3_PUBLIC_BASE_URL, sync: false}
      # Auth + limits (A4-A6)
      - {key: AUTH_SECRET, sync: false}  # same value as the PWA's API token secret
      - {key: ADMIN_EMAILS, sync: false}
      - {key: TRUST_PROXY_HEADERS, value: "true"}  # Render proxies requests; real IP is in X-Forwarded-For
      - {key: INGEST_ALLOWED_ROOTS, value: ""}  # empty => POST /ingest disabled (use presigned uploads)
