# Local stack. `docker compose up -d mongo s3 s3-init` = infra only (API/PWA native);
# `docker compose up -d --build` = everything, PWA built from ../biblioteca-eclesiastica-web.
# S3: SeaweedFS (MinIO no longer publishes public images). Same S3 API as Cloudflare R2.
services:
  mongo:
    image: mongo:8.0
    ports: ["127.0.0.1:27017:27017"]
    volumes: [mongo-data:/data/db]

  s3:
    # ponytail: no S3 identities configured, so local access is open; R2 enforces keys in production.
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: server -dir=/data -s3 -s3.port=9000
    ports: ["127.0.0.1:9000:9000"]
    volumes: [s3-data:/data]

  s3-init:
    image: amazon/aws-cli@sha256:ce44b800602264c12298bbf3399055a4cefdb9ed4a098abe564afe26e7071bce
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: auto
    entrypoint: >
      /bin/sh -c "for i in $$(seq 1 30); do
      aws --endpoint-url http://s3:9000 s3api head-bucket --bucket biblioteca 2>/dev/null && exit 0;
      aws --endpoint-url http://s3:9000 s3 mb s3://biblioteca && exit 0;
      sleep 2; done; exit 1"
    restart: "no"

  api:
    build: .
    depends_on:
      mongo: {condition: service_started}
      s3-init: {condition: service_completed_successfully}
    env_file: [{path: .env, required: false}]
    environment:
      MONGODB_URI: mongodb://mongo:27017
      S3_ENDPOINT_URL: http://s3:9000
      S3_PRESIGN_ENDPOINT_URL: http://localhost:9000  # signed URLs are used by the browser
      S3_ACCESS_KEY_ID: local
      S3_SECRET_ACCESS_KEY: local
      S3_BUCKET: biblioteca
      S3_PUBLIC_BASE_URL: ""
      CORS_ORIGINS: http://localhost:3010
      WORKER_ENABLED: "true"
      OCR_PROVIDER: tesseract
      OPENDATALOADER_ENABLED: ${LOCAL_OPENDATALOADER_ENABLED:-true}
      # DEV-ONLY default secret, shared with the web service below. Never use in production.
      AUTH_SECRET: ${LOCAL_AUTH_SECRET:-dev-only-insecure-local-auth-secret}
      ADMIN_EMAILS: ${LOCAL_ADMIN_EMAIL:-admin@biblioteca.local}
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 30

  web:
    build:
      context: ../biblioteca-eclesiastica-web  # sibling clone required
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000  # browser -> API
    depends_on:
      api: {condition: service_healthy}
    environment:
      API_BASE_URL: http://api:8000  # server-side -> API
      API_AUTH_SECRET: ${LOCAL_AUTH_SECRET:-dev-only-insecure-local-auth-secret}
      AUTH_SECRET: dev-only-insecure-local-session-secret  # DEV-ONLY session cookie secret
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://localhost:3010
      AUTH_DEV_LOGIN: "true"
      AUTH_DEV_EMAILS: ${LOCAL_ADMIN_EMAIL:-admin@biblioteca.local}
    ports: ["127.0.0.1:3010:3010"]

volumes:
  mongo-data:
  s3-data:
