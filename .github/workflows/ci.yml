name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
    env:
      MONGODB_URI: mongodb://localhost:27017
      OPENDATALOADER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.10"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa tesseract-ocr-lat
      - run: uv sync --frozen
      - run: uv run python -m compileall -q app tests/tools scripts
      - run: uv run pytest -q -rs
